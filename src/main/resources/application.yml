spring:
  application:
    name: knou-cbt

  datasource:
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:8}
      minimum-idle: 0
      initialization-fail-timeout: -1

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

