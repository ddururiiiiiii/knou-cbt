spring:
  application:
    name: knou-cbt

  datasource:
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:8}
      minimum-idle: 0
      initialization-fail-timeout: -1

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
            scope: email, profile
          kakao:
            client-id: ${KAKAO_OAUTH_CLIENT_ID:}
            client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            scope: profile_nickname, account_email
          naver:
            client-id: ${NAVER_OAUTH_CLIENT_ID:}
            client-secret: ${NAVER_OAUTH_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Naver
            scope: name, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  # 회원가입/로그인 버튼 노출 여부. 배포 후에도 /login 경로로는 계속 테스트 가능하고,
  # 이 값을 켜야 네비게이션에 버튼이 노출된다 (조용히 배포 후 검증하고 나중에 공개하기 위한 feature flag).
  member-login:
    enabled: ${MEMBER_LOGIN_ENABLED:false}
