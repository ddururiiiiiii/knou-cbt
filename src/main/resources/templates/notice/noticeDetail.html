<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}">
<head>
  <meta charset="UTF-8">
  <title>공지사항 상세</title>
</head>
<body>
<div layout:fragment="content">
  <div class="py-3 text-center">
    <h2>공지사항</h2>
  </div>

  <!-- 버튼 영역 (수정/삭제/목록) - 상단 -->
  <div class="d-flex justify-content-end gap-2 mb-3">
    <!-- 관리자만 보이는 버튼 -->
    <a th:href="@{/notices/{id}/edit(id=${notice.id})}"
       class="btn btn-outline-primary btn-sm"
       sec:authorize="hasRole('ADMIN')">수정</a>

    <form th:action="@{/notices/{id}(id=${notice.id})}"
          method="post"
          sec:authorize="hasRole('ADMIN')"
          data-confirm="정말 삭제하시겠습니까?">
      <input type="hidden" name="_method" value="delete"/>
      <button type="submit" class="btn btn-danger btn-sm">삭제</button>
    </form>

    <!-- 목록 버튼 (누구나 볼 수 있음) -->
    <a th:href="@{/notices}" class="btn btn-secondary btn-sm">목록</a>
  </div>

  <!-- 공지 제목 + 작성일 -->
  <div class="mb-3 d-flex justify-content-between align-items-end flex-wrap gap-2">
    <h3 class="mb-0">
      <span th:if="${notice.pinned}" class="badge notice-pin-badge me-1"
            data-bs-toggle="tooltip" title="상단 고정된 공지입니다"><i class="bi bi-pin-angle-fill"></i></span>
      <span th:if="${notice.useYn.name() == 'N'}" class="badge bg-secondary me-1"
            sec:authorize="hasRole('ADMIN')">비공개</span>
      <span th:text="${notice.title}"></span>
    </h3>
    <div class="text-muted small" th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm')}"></div>
  </div>

  <!-- 내용 -->
  <div class="mb-4 border p-3 notice-content" th:utext="${notice.content}">
    공지사항 내용
  </div>

  <!-- 버튼 영역 (수정/삭제/목록) - 하단 -->
  <div class="d-flex justify-content-end gap-2 mt-3">
    <!-- 관리자만 보이는 버튼 -->
    <a th:href="@{/notices/{id}/edit(id=${notice.id})}"
       class="btn btn-outline-primary btn-sm"
       sec:authorize="hasRole('ADMIN')">수정</a>

    <form th:action="@{/notices/{id}(id=${notice.id})}"
          method="post"
          sec:authorize="hasRole('ADMIN')"
          data-confirm="정말 삭제하시겠습니까?">
      <input type="hidden" name="_method" value="delete"/>
      <button type="submit" class="btn btn-danger btn-sm">삭제</button>
    </form>

    <!-- 목록 버튼 (누구나 볼 수 있음) -->
    <a th:href="@{/notices}" class="btn btn-secondary btn-sm">목록</a>
  </div>

</div>
</body>
<th:block layout:fragment="script">
    <script src="/js/confirm-delete.js"></script>
</th:block>
</html>
