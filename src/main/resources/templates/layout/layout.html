<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="/css/app.css" rel="stylesheet">
    <title layout:title-pattern="$CONTENT_TITLE : KNOU - CBT">KNOU - CBT</title>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2360128741368426"
            crossorigin="anonymous"></script>
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2J0NPPN1MD"></script>
<script src="/js/analytics.js"></script>

<body class="d-flex flex-column min-vh-100">

<!-- 공통 네비게이션 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <i class="bi bi-mortarboard-fill" style="color: #a5b4fc; font-size: 1.3rem;"></i>
            <span>KNOU<span style="color: #a5b4fc;">·</span>CBT</span>
        </a>
        <span class="admin-mode-badge me-2" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-shield-lock-fill"></i> 관리자모드
        </span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="메뉴 열기/닫기">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/exams}">시험보기</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/notices}">공지사항</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/about}">서비스 소개</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/faq}">자주 묻는 질문</a>
                </li>

                <!-- 관리자 전용 메뉴 -->

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link nav-link-admin" th:href="@{/admin/departments}">학과관리</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link nav-link-admin" th:href="@{/admin/subjects}">과목관리</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link nav-link-admin" th:href="@{/admin/statistics}">통계</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link nav-link-admin" th:href="@{/admin/maintenance}">배포/점검관리</a>
                </li>
                <li class="nav-item d-flex align-items-center" sec:authorize="hasRole('ADMIN')">
                    <form th:action="@{/logout}" method="post" class="d-flex ms-lg-2">
                        <button class="nav-logout-btn">로그아웃</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- 사전 공지 배너 (정기점검 예고 등) -->
<div class="alert alert-warning rounded-0 mb-0 text-center" th:if="${operationBanner != null}">
    <span th:text="${operationBanner.bannerMessage}"></span>
    <span th:if="${operationBanner.bannerScheduledAt != null}">
        (<span th:text="${#temporals.format(operationBanner.bannerScheduledAt, 'yyyy-MM-dd HH:mm')}"></span>)
    </span>
</div>

<!-- 페이지별 컨텐츠 -->
<div class="container mt-4 mb-5 flex-grow-1" layout:fragment="content">
    <!-- 기본 내용 자리 -->
</div>


<!-- 풋터 -->
<footer class="site-footer mt-auto">
    <div class="container">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3 py-4">
            <div class="footer-brand">
                <i class="bi bi-mortarboard-fill"></i> KNOU<span class="footer-dot">·</span>CBT
            </div>
            <div class="footer-links">
                <a th:href="@{/about}">서비스 소개</a>
                <a th:href="@{/faq}">자주 묻는 질문</a>
                <a href="mailto:workingsg913@gmail.com"><i class="bi bi-envelope"></i> 문의하기</a>
                <a href="https://github.com/ddururiiiiiii/knou-cbt" target="_blank"><i class="bi bi-github"></i> GitHub</a>
                <a th:href="@{/privacy}">개인정보처리방침</a>
            </div>
        </div>
        <div class="footer-note text-center pb-4">
            © 2026 KNOU-CBT · 한국방송통신대학교 학생들을 위한 비공식 전자 기출문제집입니다
        </div>
    </div>
</footer>

<div th:replace="~{fragments/dialogs :: dialogs}"></div>

<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/ui-dialog.js"></script>
<script src="/js/app-init.js"></script>
<th:block layout:fragment="script"></th:block>
</body>
</html>
