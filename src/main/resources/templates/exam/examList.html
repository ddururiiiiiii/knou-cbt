<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>시험 보기</title>
</head>

<body>
<div layout:fragment="content">
    <div class="py-3 text-center">
        <h2>시험 보기</h2>
    </div>

    <div th:replace="~{fragments/help-banner :: banner('학과 → 과목 → 구분 → 년도 순서로 선택하면 원하는 시험을 빠르게 찾을 수 있어요. 시험 시간은 문제당 1분씩 계산돼요 (25문제면 총 25분).')}"></div>

    <div class="mb-3 d-flex justify-content-between align-items-center gap-2 exam-toolbar-row">
        <!-- 왼쪽: 검색 + 초기화 -->
        <div class="d-flex align-items-center gap-2 exam-filter-scroll">
            <form th:action="@{/exams}" method="get" id="searchForm" class="d-flex align-items-center gap-2 exam-filter-form">

                <!-- 학과 -->
                <select class="form-select form-select-sm exam-filter-select" name="departmentId" id="departmentSelect">
                    <option value="">학과 선택</option>
                    <option th:each="dept : ${departments}"
                            th:value="${dept.id}"
                            th:text="${dept.departmentName}"
                            th:selected="${departmentId != null and departmentId == dept.id}">
                    </option>
                </select>

                <!-- 과목 -->
                <select class="form-select form-select-sm exam-filter-select" name="subjectId" id="subjectSelect"
                        th:disabled="${departmentId == null}">
                    <option value="">과목 선택</option>
                    <option th:each="subj : ${subjects}"
                            th:value="${subj.id}"
                            th:text="|${subj.subjectName} (${subj.gradeDisplay}, ${subj.semester.description})|"
                            th:selected="${subjectId != null and subjectId == subj.id}">
                    </option>
                </select>

                <!-- 구분 -->
                <select class="form-select form-select-sm exam-filter-select" name="examType" id="examTypeSelect"
                        th:disabled="${subjectId == null}">
                    <option value="">구분 선택</option>
                    <option th:each="type : ${examTypes}"
                            th:value="${type}"
                            th:text="${type.description}"
                            th:selected="${examType != null and examType == type}">
                    </option>
                </select>

                <!-- 년도 -->
                <select class="form-select form-select-sm exam-filter-select" name="year" id="yearSelect"
                        th:disabled="${examType == null}">
                    <option value="">년도 선택</option>
                    <option th:each="y : ${#numbers.sequence(2001, 2019)}"
                            th:value="${y}"
                            th:text="${y}"
                            th:selected="${year != null and year == y}">
                    </option>
                </select>
            </form>

            <!-- 초기화 버튼 -->
            <button type="button" class="btn btn-secondary btn-sm flex-shrink-0" id="resetBtn">초기화</button>
        </div>

        <!-- 오른쪽: 등록 버튼 (관리자 전용) -->
        <a class="btn btn-primary btn-sm flex-shrink-0 exam-register-btn" th:href="@{/admin/exams/new}" sec:authorize="hasRole('ADMIN')">등록</a>
    </div>

    <span style="font-weight: bold;" th:text="|총 ${pagination.totalElements} 건|"></span>

    <!-- 시험 테이블 -->
    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr style="text-align: center;">
            <th>번호</th>
            <th>과목명</th>
            <th>학과명</th>
            <th>학년</th>
            <th>학기</th>
            <th>시험 구분</th>
            <th>년도</th>
            <th sec:authorize="hasRole('ADMIN')">사용 여부</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="exam, stat : ${pagination.content}">
            <td th:text="${stat.index + 1}" style="text-align: center;"></td>
            <td th:text="${exam.subjectName}"></td>
            <td th:text="${exam.departmentName}"></td>
            <td th:text="${exam.gradeDisplay}" style="text-align: center;"></td>
            <td th:text="${exam.semester.description}" style="text-align: center;"></td>
            <td th:text="${exam.examType.description}"></td>
            <td th:text="${exam.year}" style="text-align: center;"></td>
            <td style="text-align: center;" sec:authorize="hasRole('ADMIN')">
                <span th:text="${exam.useYn.description}"></span>
                <i th:if="${exam.useYn.name() == 'Y' and !exam.effectivelyActive}"
                   class="bi bi-exclamation-triangle-fill text-warning"
                   data-bs-toggle="tooltip"
                   title="상위 과목 또는 학과가 미사용 상태라 비회원에게는 안 보입니다."></i>
            </td>
            <td class="text-center">
                <!-- 수정 버튼 (관리자 전용) -->
                <a th:href="@{'/admin/exams/' + ${exam.id} + '/edit'}"
                   class="btn btn-sm btn-outline-primary"
                   sec:authorize="hasRole('ADMIN')">수정</a>

                <!-- 삭제 가능 (관리자 전용) -->
                <form th:if="${!exam.hasExamQuestions}"
                      th:action="@{'/admin/exams/' + ${exam.id}}"
                      method="post"
                      style="display:inline;"
                      data-confirm="정말 삭제하시겠습니까?"
                      sec:authorize="hasRole('ADMIN')">
                    <input type="hidden" name="_method" value="delete"/>
                    <button type="submit" class="btn btn-sm btn-danger">삭제</button>
                </form>

                <!-- 삭제 불가 (관리자 전용) -->
                <button th:if="${exam.hasExamQuestions}"
                        type="button"
                        class="btn btn-sm btn-secondary"
                        data-bs-toggle="tooltip"
                        title="이미 등록된 문제가 있어 삭제가 불가능합니다."
                        sec:authorize="hasRole('ADMIN')">
                    삭제 불가
                </button>

                <!-- 문제 관리 버튼 (관리자 전용) -->
                <button type="button"
                        class="btn btn-sm btn-warning"
                        th:data-questions-url="@{/admin/exams/{examId}/questions(examId=${exam.id})}"
                        sec:authorize="hasRole('ADMIN')">
                    문제 관리
                </button>

                <!-- 문제 풀기 (일반 사용자도 가능) -->
                <button type="button" class="btn btn-sm btn-primary"
                        th:data-solve-url="@{/exams/{examId}/solve(examId=${exam.id})}"
                        th:data-solve-info="|${exam.departmentName} ${exam.subjectName} ${exam.gradeDisplay} ${exam.semester.description} ${exam.examType.description} ${exam.year}년|">
                    문제 풀기
                </button>
            </td>

        </tr>
        <tr th:if="${pagination.content.size() == 0}">
            <td colspan="9" class="text-center" sec:authorize="hasRole('ADMIN')">등록된 시험이 없습니다.</td>
            <td colspan="8" class="text-center" sec:authorize="!hasRole('ADMIN')">등록된 시험이 없습니다.</td>
        </tr>
        </tbody>
    </table>

    <!-- 페이지네이션 -->
    <nav aria-label="Page navigation" th:if="${pagination.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${pagination.currentPage > 1} ? '' : 'disabled'">
                <a class="page-link"
                   th:href="@{/exams(page=1, keyword=${keyword}, useYn=${param.useYn}, departmentId=${departmentId}, subjectId=${subjectId}, examType=${examType}, year=${year})}">First</a>
            </li>
            <li class="page-item" th:classappend="${pagination.currentPage > 1} ? '' : 'disabled'">
                <a class="page-link"
                   th:href="@{/exams(page=${pagination.currentPage - 1}, keyword=${keyword}, useYn=${param.useYn}, departmentId=${departmentId}, subjectId=${subjectId}, examType=${examType}, year=${year})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(1, pagination.totalPages)}"
                th:classappend="${i == pagination.currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/exams(page=${i}, keyword=${keyword}, useYn=${param.useYn}, departmentId=${departmentId}, subjectId=${subjectId}, examType=${examType}, year=${year})}"
                   th:text="${i}"></a>
            </li>
            <li class="page-item" th:classappend="${pagination.currentPage < pagination.totalPages} ? '' : 'disabled'">
                <a class="page-link"
                   th:href="@{/exams(page=${pagination.currentPage + 1}, keyword=${keyword}, useYn=${param.useYn}, departmentId=${departmentId}, subjectId=${subjectId}, examType=${examType}, year=${year})}">Next</a>
            </li>
            <li class="page-item" th:classappend="${pagination.currentPage < pagination.totalPages} ? '' : 'disabled'">
                <a class="page-link"
                   th:href="@{/exams(page=${pagination.totalPages}, keyword=${keyword}, useYn=${param.useYn}, departmentId=${departmentId}, subjectId=${subjectId}, examType=${examType}, year=${year})}">Last</a>
            </li>
        </ul>
    </nav>
</div>
</body>
<th:block layout:fragment="script">
    <script src="/js/exam-list.js"></script>
</th:block>
</html>
