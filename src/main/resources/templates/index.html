<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}"><head>
    <meta charset="UTF-8">
    <title>메인</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-3 mb-4">

        <!-- Hero Section -->
        <div class="hero text-center">
            <div class="hero-icon">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h1>KNOU<span class="hero-dot">·</span>CBT</h1>
            <p>방통대 졸업생이 직접 만든 전자 기출문제집 서비스 🎓<br>
                기출문제를 풀고 학습 효율을 높여보세요!</p>
            <p class="mt-2 text-light">
                🚀 현재 서비스는 <strong>Beta 버전</strong>으로 배포되었습니다.
                버그가 있을 수 있으며, 지속적으로 개선 중입니다.
            </p>

            <!-- 통계 배지 -->
            <div class="stats-row d-flex justify-content-center flex-wrap gap-2 mt-3">
                <span class="stat-badge"><i class="bi bi-mortarboard"></i> 학과 <strong th:text="${departmentCount}"></strong>개</span>
                <span class="stat-badge"><i class="bi bi-journal-text"></i> 과목 <strong th:text="${subjectCount}"></strong>개</span>
                <span class="stat-badge"><i class="bi bi-clipboard-check"></i> 기출문제 <strong th:text="${examCount}"></strong>개</span>
            </div>
        </div>

        <!-- 시험보기 | 공지사항 버튼 -->
        <div class="row g-3 mb-3 mt-1">
            <div class="col-md-6">
                <a href="/exams" class="btn btn-primary w-100 h-100 shortcut-btn shortcut-cta">
                    <div class="shortcut-cta-title">📝 시험보기</div>
                    <div class="shortcut-cta-sub">학과 · 과목별 기출문제 풀어보기</div>
                </a>
            </div>
            <div class="col-md-6">
                <a href="/notices" class="btn w-100 h-100 shortcut-btn shortcut-cta shortcut-cta-notice">
                    <div class="shortcut-cta-title">📢 공지사항</div>
                    <div class="shortcut-cta-sub">서비스 소식과 안내 확인하기</div>
                </a>
            </div>
        </div>

        <!-- 공지사항(목록) | 학과별 바로가기 -->
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="notice-card p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h4 class="mb-0 fs-6 fw-bold">📢 공지사항</h4>
                        <a href="/notices" class="btn btn-sm btn-outline-secondary">더보기</a>
                    </div>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex align-items-center gap-2 px-0" th:each="notice : ${recentNotices}">
                            <span th:if="${notice.pinned}" class="badge bg-warning text-dark flex-shrink-0">공지</span>
                            <a th:href="@{'/notices/' + ${notice.id}}"
                               th:text="${notice.title}"
                               class="text-decoration-none text-truncate"
                               style="min-width: 0;"></a>
                            <span class="text-muted small flex-shrink-0 ms-auto"
                                  th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd')}"></span>
                        </li>
                        <li class="list-group-item text-center text-muted px-0"
                            th:if="${#lists.isEmpty(recentNotices)}">
                            등록된 공지사항이 없습니다.
                        </li>
                    </ul>
                </div>
            </div>
            <div class="col-md-6">
                <div class="dept-quicklist h-100">
                    <div class="dept-quicklist-title">🏫 학과별 기출문제 바로가기</div>
                    <div class="dept-chip-row">
                        <a th:each="dept : ${departments}"
                           th:href="@{/exams(departmentId=${dept.id})}"
                           th:text="${dept.departmentName}"
                           class="dept-chip"></a>
                        <span th:if="${#lists.isEmpty(departments)}" class="text-muted small">등록된 학과가 없습니다.</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 기출문제가 많은 과목 : 실데이터가 쌓일 때까지 임시로 숨김. 데이터 충분해지면 아래 주석 해제
        <div class="mb-4" th:if="${!#lists.isEmpty(popularSubjects)}">
            <h4 class="mb-3">📚 기출문제가 많은 과목</h4>
            <div class="row g-3">
                <div class="col-6 col-md-3" th:each="subj : ${popularSubjects}">
                    <a th:href="@{/exams(departmentId=${subj.departmentId}, subjectId=${subj.id})}" class="popular-subject-card d-block text-decoration-none">
                        <div class="fw-bold text-truncate" th:text="${subj.subjectName}"></div>
                        <div class="text-muted small text-truncate" th:text="${subj.departmentName}"></div>
                        <div class="popular-subject-count" th:text="|기출 ${subj.examCount}개|"></div>
                    </a>
                </div>
            </div>
        </div>
        -->

    </div>
</div>
</body>
</html>
