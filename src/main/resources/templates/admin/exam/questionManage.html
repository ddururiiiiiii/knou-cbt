<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>시험 문제</title>
</head>
<body>
<div layout:fragment="content">
    <!--<div class="container" id="content">-->
    <div class="py-4 text-center">
        <h2>시험 문제 관리</h2>
    </div>

    <div th:replace="~{fragments/help-banner :: banner('문제를 직접 입력하거나 엑셀로 일괄 업로드할 수 있어요. 정답은 쉼표로 구분해 여러 개 입력할 수 있습니다 (예: 1,3).
미리보기는 화면에 입력 중인 내용이 아니라 마지막으로 저장된 데이터를 보여주니, 수정한 내용을 미리보기로 확인하려면 먼저 저장해주세요.')}"></div>

    <div th:if="${saveSuccess}" class="alert alert-success" role="alert">
        저장이 완료되었습니다!
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}">
        오류가 발생했습니다.
    </div>

    <!-- 시험 기본 정보 -->
    <div class="card mb-4" style="border-left: 4px solid var(--kcbt-accent);">
        <div class="card-body py-3">
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
                <div class="d-flex align-items-center flex-wrap gap-2">
                    <span class="badge rounded-pill" style="background-color: var(--kcbt-accent-soft); color: var(--kcbt-accent-dark);"
                          th:text="${exam.departmentName}">학과</span>
                    <h5 class="fw-bold mb-0" th:text="${exam.subjectName}">과목</h5>
                    <span class="text-muted">·</span>
                    <span class="badge bg-secondary" th:text="${exam.examType.description}">구분</span>
                    <span class="text-muted small" th:text="|${exam.gradeDisplay} · ${exam.semester.description} · ${exam.year}년도|">학년/학기/년도</span>
                </div>
                <span class="text-muted small"
                      data-bs-toggle="tooltip" data-bs-placement="top"
                      title="엑셀 업로드 양식의 '시험ID' 컬럼에 들어가는 값입니다.">
                    시험 고유 ID: <strong th:text="${exam.id}">0</strong>
                </span>
            </div>
        </div>
    </div>

    <!-- 엑셀 관련 버튼 -->
    <div class="d-flex justify-content-start mb-3 gap-2">
        <a th:href="@{/admin/exams/{examId}/questions/excel-template(examId=${exam.id})}"
           class="btn btn-outline-success">엑셀 양식 다운로드</a>

        <form th:action="@{/admin/exams/{examId}/questions/excel-upload(examId=${exam.id})}"
              method="post" enctype="multipart/form-data" class="d-inline">
            <input type="file" id="excelFile" name="file"
                   accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel"
                   style="display: none;">
            <button type="button" id="uploadExcelBtn" class="btn btn-outline-primary">
                엑셀 업로드
            </button>
        </form>
    </div>

    <form id="questionForm"
          th:action="@{/admin/exams/{examId}/questions/save(examId=${examId})}"
          method="post" enctype="multipart/form-data">

        <div class="d-flex justify-content-between mb-3">
            <div>
                <button type="button" id="addRowBtn" class="btn btn-success">행 추가</button>
                <button type="button" id="deleteSelectedBtn" class="btn btn-danger">선택 행 삭제</button>
                <button type="button" id="sortRowsBtn" class="btn btn-info">번호 자동정렬</button>
            </div>
            <div>
                <a th:href="@{/exams}" class="btn btn-secondary">목록으로</a>
                <a href="javascript:void(0);"
                   id="previewBtn"
                   th:data-exam-id="${exam.id}"
                   class="btn btn-warning">미리보기</a>
                <button type="submit" id="saveBtn" class="btn btn-primary">저장</button>
            </div>
        </div>

        <span id="questionCount" class="me-3 fw-bold">총 <span id="countValue" th:text="${#lists.size(questions)}">0</span> 문제</span>

        <div class="table-responsive">
        <table class="table table-bordered text-center align-middle question-table">
            <colgroup>
                <col style="width: 4%;">   <!-- 선택 -->
                <col style="width: 4%;">   <!-- 번호 -->
                <col style="width: 15%;">  <!-- 문제 -->
                <col style="width: 8%;">  <!-- 보기유형 -->
                <col style="width: 8%;">  <!-- 레이아웃 -->
                <col style="width: 9%;">  <!-- 보기1 -->
                <col style="width: 9%;">  <!-- 보기2 -->
                <col style="width: 9%;">  <!-- 보기3 -->
                <col style="width: 9%;">  <!-- 보기4 -->
                <col style="width: 7%;">  <!-- 정답 -->
                <col style="width: 14%;"> <!-- 문제이미지 -->
                <col style="width: 4%;">   <!-- 삭제 -->
            </colgroup>
            <thead class="table-light">
            <tr>
                <th><input type="checkbox" id="selectAll"/></th>
                <th>번호</th>
                <th>문제</th>
                <th>보기유형</th>
                <th>레이아웃</th>
                <th>보기1</th>
                <th>보기2</th>
                <th>보기3</th>
                <th>보기4</th>
                <th>정답</th>
                <th>문제이미지</th>
                <th>삭제</th>
            </tr>
            </thead>
            <tbody id="questionTable">
            <tr th:each="q, iterStat : ${questions}"
                th:classappend="${q.optionType != null and q.optionType.name() == 'IMAGE'} ? 'row-option-image'">
                <td><input type="checkbox" class="row-check"/></td>
                <td>
                    <input type="text" class="form-control" th:name="|questions[${iterStat.index}].questionNo|"
                           th:value="${q.questionNo}" th:title="${q.questionNo}"
                           data-bs-toggle="tooltip" data-bs-placement="top"/>
                    <div class="invalid-feedback">숫자만 입력</div>
                </td>
                <td><input type="text" class="form-control" th:name="|questions[${iterStat.index}].questionText|" th:value="${q.questionText}" th:title="${q.questionText}"
                           data-bs-toggle="tooltip" data-bs-placement="top"/></td>
                <td>
                    <select class="form-select form-select-sm option-type-select"
                            th:name="|questions[${iterStat.index}].optionType|"
                            th:title="${q.optionType != null and q.optionType.name() == 'IMAGE'} ? '이미지' : '텍스트'"
                            data-bs-toggle="tooltip" data-bs-placement="top">
                        <option value="TEXT" th:selected="${q.optionType == null or q.optionType.name() == 'TEXT'}">텍스트</option>
                        <option value="IMAGE" th:selected="${q.optionType != null and q.optionType.name() == 'IMAGE'}">이미지</option>
                    </select>
                </td>
                <td>
                    <select class="form-select form-select-sm image-layout-select"
                            th:name="|questions[${iterStat.index}].imageLayout|"
                            th:disabled="${q.optionType == null or q.optionType.name() != 'IMAGE'}"
                            th:title="${q.imageLayout != null and q.imageLayout.name() == 'STACK_1X4'} ? '1단(세로4줄)' : '2단(2x2)'"
                            data-bs-toggle="tooltip" data-bs-placement="top">
                        <option value="GRID_2X2" th:selected="${q.imageLayout == null or q.imageLayout.name() == 'GRID_2X2'}">2단(2x2)</option>
                        <option value="STACK_1X4" th:selected="${q.imageLayout != null and q.imageLayout.name() == 'STACK_1X4'}">1단(세로4줄)</option>
                    </select>
                </td>
                <td th:each="n : ${#numbers.sequence(1, 4)}"
                    th:with="optVal=${n == 1 ? q.option1 : (n == 2 ? q.option2 : (n == 3 ? q.option3 : q.option4))}">
                    <input type="text" class="form-control form-control-sm option-text-input mb-1"
                           th:name="|questions[${iterStat.index}].option__${n}__|"
                           th:value="${optVal}" th:title="${optVal}"
                           data-bs-toggle="tooltip" data-bs-placement="top"/>
                    <input type="file" class="form-control form-control-sm option-file-input" accept="image/*"
                           th:name="|questions[${iterStat.index}].option__${n}__File|" title="첨부파일 없음"
                           data-bs-toggle="tooltip" data-bs-placement="top"/>
                    <span class="option-image-preview-wrap"
                          th:classappend="${optVal == null or !optVal.startsWith('http')} ? 'd-none'">
                        <span class="text-primary option-image-preview"
                              style="cursor:pointer;"
                              data-bs-toggle="tooltip"
                              data-bs-html="true"
                              th:title="${optVal != null and optVal.startsWith('http')} ? |<img src='${optVal}' class='tooltip-img-preview'/>| : ''">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-image" viewBox="0 0 16 16">
                              <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
                              <path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1z"/>
                            </svg>
                        </span>
                        <button type="button" class="btn btn-link btn-sm text-danger p-0 btn-delete-option-image" title="이미지 삭제"><i class="bi bi-x-circle-fill"></i></button>
                    </span>
                </td>
                <td>
                    <input type="text" class="form-control"
                           th:name="|questions[${iterStat.index}].answers|"
                           th:value="${q.answers}" th:title="${q.answers}"
                           data-bs-toggle="tooltip" data-bs-placement="top"/>
                    <div class="invalid-feedback">숫자(쉼표 구분)만 입력</div>
                </td>
                <td>
                    <input type="hidden" th:name="|questions[${iterStat.index}].imageUrl|"
                           th:value="${q.imageUrl}" class="question-image-url-input"/>
                    <input type="file"
                           class="form-control form-control-sm"
                           th:name="|questions[${iterStat.index}].imageFile|"
                           accept="image/*" title="첨부파일 없음"
                           data-bs-toggle="tooltip" data-bs-placement="top"/>
                    <span class="question-image-preview-wrap" th:classappend="${q.imageUrl == null} ? 'd-none'">
                        <span class="text-primary"
                              style="cursor:pointer;"
                              data-bs-toggle="tooltip"
                              data-bs-html="true"
                              th:title="${q.imageUrl != null} ? |<img src='${q.imageUrl}' class='tooltip-img-preview'/>| : ''">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-image" viewBox="0 0 16 16">
                                  <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
                                  <path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1z"/>
                                </svg>
                        </span>
                        <button type="button" class="btn btn-link btn-sm text-danger p-0 btn-delete-question-image" title="이미지 삭제"><i class="bi bi-x-circle-fill"></i></button>
                    </span>
                </td>
                <td>
                    <button type="button" class="btn btn-link btn-delete-row p-0" title="문제 삭제"><i class="bi bi-x-circle-fill text-danger fs-4"></i></button>
                </td>
            </tr>
            </tbody>
            <tfoot class="table-light">
            <tr>
                <th><input type="checkbox" id="selectAllBottom"/></th>
                <th>번호</th>
                <th>문제</th>
                <th>보기유형</th>
                <th>레이아웃</th>
                <th>보기1</th>
                <th>보기2</th>
                <th>보기3</th>
                <th>보기4</th>
                <th>정답</th>
                <th>문제이미지</th>
                <th>삭제</th>
            </tr>
            </tfoot>
        </table>
        </div>

        <div class="d-flex justify-content-between mt-3">
            <div>
                <button type="button" id="addRowBtnBottom" class="btn btn-success">행 추가</button>
                <button type="button" id="deleteSelectedBtnBottom" class="btn btn-danger">선택 행 삭제</button>
                <button type="button" id="sortRowsBtnBottom" class="btn btn-info">번호 자동정렬</button>
            </div>
            <div>
                <a th:href="@{/exams}" class="btn btn-secondary">목록으로</a>
                <a href="javascript:void(0);"
                   id="previewBtnBottom"
                   th:data-exam-id="${exam.id}"
                   class="btn btn-warning">미리보기</a>
                <button type="submit" id="saveBtnBottom" class="btn btn-primary">저장</button>
            </div>
        </div>

        <span class="fw-bold">총 <span id="countValueBottom" th:text="${#lists.size(questions)}">0</span> 문제</span>

    </form>
</div>
</body>
<th:block layout:fragment="script">
    <script src="/js/question-manage.js"></script>
</th:block>
</html>
