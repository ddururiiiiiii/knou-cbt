<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">학과 등록/수정</title>
</head>
<body>
<div layout:fragment="content">
    <div class="py-3 text-center">
        <h2 th:text="${formTitle}">학과 등록/수정</h2>
    </div>

    <form th:action="@{${actionUrl}}" th:object="${department}" method="post">
        <input type="hidden" name="_method" th:if="${method != 'post'}" th:value="${method}"/>

        <div class="mb-3">
            <label for="departmentName" class="form-label">학과명</label>
            <input type="text"
                   th:field="*{departmentName}"
                   id="departmentName"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('departmentName')} ? ' is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('departmentName')}">
                <small th:errors="*{departmentName}"></small>
            </div>
        </div>

        <div class="mb-3" th:if="${mode == 'edit'}">
            <label class="form-label d-block">사용 여부</label>
            <div class="form-check form-check-inline" th:each="yn : ${useYnValues}">
                <input type="radio" class="form-check-input" th:field="*{useYn}" th:value="${yn}"/>
                <label class="form-check-label" th:for="${#ids.prev('useYn')}" th:text="${yn.description}"></label>
            </div>
        </div>
        <div class="mb-3" style="text-align: right;">
            <button type="submit" class="btn btn-primary" th:text="${formTitle}"></button>
            <a th:href="@{/admin/departments}" class="btn btn-secondary">취소</a>
        </div>
    </form>
</div>
</body>
</html>
