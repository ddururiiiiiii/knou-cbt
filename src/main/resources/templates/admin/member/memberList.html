<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <title>회원 관리</title>
</head>
<body>
<div layout:fragment="content">
    <div class="py-3 text-center">
        <h2>회원 목록</h2>
    </div>

    <div class="mb-3 d-flex justify-content-between">
        <form th:action="@{/admin/members}" method="get" class="d-flex align-items-center">
            <input type="text"
                   class="form-control form-control-sm me-2"
                   name="keyword"
                   placeholder="닉네임/이메일 검색"
                   autocomplete="off"
                   style="width: 220px;"
                   th:value="${keyword}">
            <button type="submit" class="btn btn-primary btn-sm">검색</button>
        </form>
    </div>

    <span style="font-weight: bold;" th:text="|총 ${pagination.totalElements} 건|"></span>
    <div>
        <table class="table table-bordered table-hover">
            <thead class="table-light">
            <tr style="text-align: center;">
                <th>No</th>
                <th>회원ID</th>
                <th>가입경로</th>
                <th>닉네임</th>
                <th>이메일</th>
                <th>가입일</th>
                <th>최근 로그인</th>
                <th>관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="member, stat : ${pagination.content}" style="text-align: center;">
                <td th:text="${stat.index + 1}"></td>
                <td th:text="${member.id}"></td>
                <td th:text="${member.provider}"></td>
                <td th:text="${member.nickname}"></td>
                <td th:text="${member.email ?: '-'}"></td>
                <td th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd')}"></td>
                <td th:text="${member.lastLoginAt != null ? #temporals.format(member.lastLoginAt, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                <td>
                    <form th:action="@{/admin/members/{id}(id=${member.id})}"
                          method="post"
                          style="display:inline;"
                          data-confirm="이 회원을 탈퇴 처리하시겠습니까? 개인정보는 삭제되고 응시 기록만 비식별로 남습니다.">
                        <input type="hidden" name="_method" value="delete"/>
                        <button type="submit" class="btn btn-danger btn-sm">탈퇴 처리</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pagination.content)}">
                <td colspan="8" class="text-center text-muted">가입한 회원이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav aria-label="Page navigation" th:if="${pagination.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:each="i : ${#numbers.sequence(1, pagination.totalPages)}"
                th:classappend="${i == pagination.currentPage} ? 'active'">
                <a class="page-link" th:href="@{/admin/members(page=${i}, keyword=${keyword})}" th:text="${i}"></a>
            </li>
        </ul>
    </nav>
</div>
</body>
<th:block layout:fragment="script">
    <script src="/js/confirm-delete.js"></script>
</th:block>
</html>
