<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 로그인</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
    <link href="/css/app.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        html, body { height: 100%; }
        body {
            background: linear-gradient(160deg, var(--kcbt-accent-soft) 0%, var(--kcbt-bg) 55%);
            display: flex;
            align-items: center;
        }
        .login-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background-color: var(--kcbt-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.28);
        }
        .login-icon i {
            font-size: 1.5rem;
            color: #fff;
        }
        .login-card {
            border: none;
            border-radius: 1.25rem;
            box-shadow: 0 20px 48px rgba(31, 34, 48, 0.10);
        }
        .login-brand {
            font-weight: 800;
            font-size: 1.75rem;
            letter-spacing: -0.02em;
            color: var(--kcbt-accent-dark);
        }
        .login-brand .login-dot {
            color: var(--kcbt-accent);
        }
        .input-group-text {
            background-color: var(--kcbt-surface);
            border-right: none;
            color: var(--kcbt-muted);
        }
        .form-control {
            border-left: none;
        }
        .form-control:focus {
            box-shadow: none;
        }
        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control {
            border-color: var(--kcbt-accent);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-8 col-md-5 col-lg-4">

            <div class="text-center mb-3">
                <div class="d-flex align-items-center justify-content-center gap-2 mb-2">
                    <div class="login-icon"><i class="bi bi-mortarboard-fill"></i></div>
                    <div class="login-brand">KNOU<span class="login-dot">·</span>CBT</div>
                </div>
                <p class="text-muted small mb-0">관리자 전용 페이지입니다</p>
            </div>

            <!-- 로그인 카드 -->
            <div class="card login-card">
                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/login}" method="post">
                        <!-- 아이디 -->
                        <div class="mb-3">
                            <label class="form-label small text-muted">아이디</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" name="username" placeholder="이메일" required autofocus>
                            </div>
                        </div>

                        <!-- 비밀번호 -->
                        <div class="mb-3">
                            <label class="form-label small text-muted">비밀번호</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" id="password" class="form-control" name="password" placeholder="비밀번호" required autocomplete="current-password">
                                <button type="button" class="btn btn-outline-secondary" id="togglePasswordBtn" aria-label="비밀번호 표시/숨김">
                                    <i class="bi bi-eye" id="togglePasswordIcon"></i>
                                </button>
                            </div>
                        </div>

                        <!-- 자동 로그인 -->
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me" value="true">
                            <label class="form-check-label small" for="remember-me">자동 로그인 (14일간 유지)</label>
                        </div>

                        <!-- 에러 메시지 -->
                        <div th:if="${param.error}" class="alert alert-danger py-2 small mb-3 text-center">
                            <i class="bi bi-exclamation-circle me-1"></i> 아이디 또는 비밀번호가 잘못되었습니다.
                        </div>

                        <!-- 버튼 -->
                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="bi bi-box-arrow-in-right me-1"></i> 로그인
                        </button>
                    </form>
                </div>
            </div>

            <!-- 하단 문구 -->
            <div class="text-center mt-3">
                <small class="text-muted">&copy; 2026 KNOU-CBT Admin</small>
            </div>
        </div>
    </div>
</div>
<script src="/js/login.js"></script>
</body>
</html>
