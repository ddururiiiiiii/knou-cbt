<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">과목 등록/수정</title>
</head>
<body>
<div layout:fragment="content">
    <div class="py-3 text-center">
        <h2 th:text="${formTitle}">과목 등록/수정</h2>
    </div>

    <form th:action="@{${actionUrl}}" th:object="${subject}" method="post">
        <input type="hidden" name="_method" th:if="${method != 'post'}" th:value="${method}"/>
        <input type="hidden" th:if="${subjectId != null}" th:field="*{id}"/>

        <!-- 과목명 -->
        <div class="mb-3">
            <label for="subjectName" class="form-label">과목명</label>
            <input type="text"
                   th:field="*{subjectName}"
                   id="subjectName"
                   class="form-control"
                   th:classappend="${#fields.hasErrors('subjectName')} ? ' is-invalid'">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('subjectName')}">
                <small th:errors="*{subjectName}"></small>
            </div>
        </div>

        <!-- 과목 구분 -->
        <div class="mb-3">
            <label for="subjectCategory" class="form-label">과목 구분</label>
            <select class="form-select"
                    id="subjectCategory"
                    th:field="*{subjectCategory}"
                    th:classappend="${#fields.hasErrors('subjectCategory')} ? ' is-invalid'">
                <option value="">선택하세요</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat}"
                        th:text="${cat.description}">
                </option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('subjectCategory')}">
                <small th:errors="*{subjectCategory}"></small>
            </div>
        </div>

        <!-- 학년 선택 (복수 선택 가능 — 하나의 과목이 여러 학년에서 개설되는 경우 대비) -->
        <div class="mb-3">
            <label class="form-label d-block">학년</label>
            <div class="form-check form-check-inline" th:each="i : ${#numbers.sequence(1,4)}">
                <input type="checkbox" class="form-check-input" th:field="*{grades}" th:value="${i}"/>
                <label class="form-check-label" th:for="${#ids.prev('grades')}" th:text="|${i}학년|"></label>
            </div>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('grades')}">
                <small th:errors="*{grades}"></small>
            </div>
        </div>

        <!-- 학기 선택 -->
        <div class="mb-3">
            <label for="semester" class="form-label">학기</label>
            <select class="form-select"
                    id="semester"
                    th:field="*{semester}"
                    th:classappend="${#fields.hasErrors('semester')} ? ' is-invalid'">
                <option value="">학기 선택</option>
                <option th:each="s : ${semesters}"
                        th:value="${s}"
                        th:text="${s.description}">
                </option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('semester')}">
                <small th:errors="*{semester}"></small>
            </div>
        </div>

        <!-- 학과 선택 -->
        <div class="mb-3">
            <label for="departmentId" class="form-label">학과</label>
            <select class="form-select"
                    id="departmentId"
                    th:field="*{departmentId}"
                    th:classappend="${#fields.hasErrors('departmentId')} ? ' is-invalid'">

                <option value="0">학과 선택</option>
                <option th:each="dept : ${departments}"
                        th:value="${dept.id}"
                        th:text="${dept.useYn != null and dept.useYn.name() == 'N'} ? |${dept.departmentName} (미사용)| : ${dept.departmentName}">
                </option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('departmentId')}">
                <small th:errors="*{departmentId}"></small>
            </div>
        </div>

        <!-- 사용 여부 (수정 모드에서만 노출) -->
        <div class="mb-3" th:if="${mode == 'edit'}">
            <label class="form-label d-block">사용 여부</label>
            <div class="form-check form-check-inline">
                <input type="radio" class="form-check-input" id="useYnY" th:field="*{useYn}" value="Y"/>
                <label class="form-check-label" for="useYnY">사용</label>
            </div>
            <div class="form-check form-check-inline">
                <input type="radio" class="form-check-input" id="useYnN" th:field="*{useYn}" value="N"/>
                <label class="form-check-label" for="useYnN">미사용</label>
            </div>
        </div>

        <!-- 버튼 영역 -->
        <div class="mb-3" style="text-align: right;">
            <button type="submit" class="btn btn-primary" th:text="${formTitle}"></button>
            <a th:href="@{/admin/subjects}" class="btn btn-secondary">취소</a>
        </div>
    </form>
</div>
</body>
</html>
