<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="banner(message)"
     class="alert d-flex align-items-center gap-2 py-2 px-3 mt-2 mb-4"
     style="background-color: var(--kcbt-accent-soft); border: 1px solid #e0e7ff; color: var(--kcbt-ink); font-size: 0.9rem;">
    <i class="bi bi-info-circle-fill" style="color: var(--kcbt-accent);"></i>
    <span th:text="${message}">도움말 내용</span>
</div>
</body>
</html>
