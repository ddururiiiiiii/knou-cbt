<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>서비스 점검 중 : KNOU - CBT</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height:100vh;">
<div class="container text-center">
    <h1 class="display-3 text-primary">점검 중</h1>
    <h3 class="mb-3">서비스 점검이 진행 중입니다.</h3>
    <p class="text-muted" th:text="${message} ?: '더 나은 서비스 제공을 위해 시스템을 점검하고 있습니다. 잠시 후 다시 시도해주세요.'">
        더 나은 서비스 제공을 위해 시스템을 점검하고 있습니다.<br>
        잠시 후 다시 시도해주세요.
    </p>
    <p class="text-muted" th:if="${expectedEndAt != null}">
        예상 종료 시각: <span th:text="${#temporals.format(expectedEndAt, 'yyyy-MM-dd HH:mm')}"></span>
    </p>
</div>
</body>
</html>
